name: git-bs Homebrew smoke test

on:
  push:
    branches: [main]
    paths:
      - Formula/git-bs.rb
      - .github/workflows/git-bs.yml
  workflow_dispatch:

jobs:
  install:
    runs-on: macos-latest
    steps:
      - run: brew install Bhacaz/tap/git-bs
      - name: Verify Git subcommand without shell reload
        run: git bs --version
      - run: brew test Bhacaz/tap/git-bs
      - run: git-bs --version
