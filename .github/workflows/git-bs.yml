name: git-bs Homebrew smoke test

on:
  push:
    branches: [main]
    paths:
      - Formula/git-bs.rb
      - .github/workflows/git-bs.yml
  workflow_dispatch:

jobs:
  install:
    strategy:
      matrix:
        os: [macos-15, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - if: runner.os == 'Linux'
        run: echo '/home/linuxbrew/.linuxbrew/bin' >> "$GITHUB_PATH"
      - run: brew install Bhacaz/tap/git-bs
      - name: Verify Git subcommand without shell reload
        run: git bs --version
      - name: Verify existing alias can be replaced immediately
        run: |
          git config --global alias.bs '!false'
          git config --global alias.bs "!$(brew --prefix git-bs)/bin/git-bs"
          git bs --version
      - run: brew test Bhacaz/tap/git-bs
      - run: git-bs --version
